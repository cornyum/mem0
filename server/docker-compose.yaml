name: mem0-dev

services:
  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    ports:
      - "8888:8000"
    env_file:
      - .env
    networks:
      - mem0_network
    volumes:
      - ./history:/app/history
      - .:/app
      - ..:/repo
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: >
      sh -c "pip install -q 'elasticsearch>=8.17,<9' prometheus-client opentelemetry-api && pip install -q --force-reinstall --no-deps /repo && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=
      - DASHBOARD_URL=http://localhost:3000
      - APP_DB_NAME=mem0_app
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-false}
      - MEM0_WORKERS=${MEM0_WORKERS:-1}
      # Vector projection tier (design §3.2): ES 8.17 primary, pgvector fallback
      - VECTOR_STORE_PROVIDER=${VECTOR_STORE_PROVIDER:-elasticsearch}
      - ES_HOST=${ES_HOST:-elasticsearch}
      - ES_PORT=${ES_PORT:-9200}
      - ES_USER=${ES_USER:-elastic}
      - ES_PASSWORD=${ES_PASSWORD:-es-dev-placeholder}
      - ES_COLLECTION_NAME=${ES_COLLECTION_NAME:-agentar_mem0}
      - ES_USE_SSL=${ES_USE_SSL:-false}

  postgres:
      image: pgvector/pgvector:pg17
      restart: on-failure
      shm_size: "128mb"
      networks:
        - mem0_network
      environment:
        - POSTGRES_USER=${POSTGRES_USER:-postgres}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -q -d postgres -U ${POSTGRES_USER:-postgres}"]
        interval: 5s
        timeout: 5s
        retries: 5
      volumes:
        - postgres_db:/var/lib/postgresql/data
        - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      ports:
        - "8432:5432"

  elasticsearch:
      # Vector + BM25 projection tier (design §3.2, ADR-2) with the analysis-ik
      # Chinese tokenizer baked in (design §6.3: text_zh = ik_max_word index /
      # ik_smart query). Single-node dev profile with security disabled;
      # production deployments enable TLS + auth.
      build:
        context: .
        dockerfile: es.Dockerfile
      restart: on-failure
      networks:
        - mem0_network
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
        - xpack.security.http.ssl.enabled=false
        - ES_JAVA_OPTS=-Xms512m -Xmx512m
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 30
      volumes:
        - es_data:/usr/share/elasticsearch/data
      ports:
        - "9200:9200"

  mem0-mcp:
      # MCP projection as its own service (fastmcp needs its own ASGI
      # lifespan; same image/env as the REST tier, same in-process tools).
      build:
        context: ..
        dockerfile: server/dev.Dockerfile
      restart: on-failure
      networks:
        - mem0_network
      env_file:
        - .env
      volumes:
        - .:/app
        - ..:/repo
      depends_on:
        postgres:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
      command: >
        sh -c "pip install -q 'elasticsearch>=8.17,<9' prometheus-client opentelemetry-api fastmcp 'fastapi==0.115.8' && pip install -q --force-reinstall --no-deps /repo && uvicorn mcp_standalone:app --host 0.0.0.0 --port 9000"
      environment:
        - PYTHONDONTWRITEBYTECODE=1
        - PYTHONUNBUFFERED=1
        - PYTHONPATH=
        - APP_DB_NAME=mem0_app
        - JWT_SECRET=${JWT_SECRET}
        - AUTH_DISABLED=${AUTH_DISABLED:-false}
        - MEM0_TELEMETRY=${MEM0_TELEMETRY:-false}
        - VECTOR_STORE_PROVIDER=${VECTOR_STORE_PROVIDER:-elasticsearch}
        - ES_HOST=${ES_HOST:-elasticsearch}
        - ES_PORT=${ES_PORT:-9200}
        - ES_USER=${ES_USER:-elastic}
        - ES_PASSWORD=${ES_PASSWORD:-es-dev-placeholder}
        - ES_COLLECTION_NAME=${ES_COLLECTION_NAME:-agentar_mem0}
        - ES_USE_SSL=${ES_USE_SSL:-false}
      ports:
        - "9100:9000"

  mem0-dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    networks:
      - mem0_network
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8888
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=${NEXT_PUBLIC_INSTANCE_NAME:-Agentar 记忆平台}
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_db:
  es_data:

networks:
  mem0_network:
    driver: bridge
