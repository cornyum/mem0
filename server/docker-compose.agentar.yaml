# Agentar 记忆平台 · 国产化/私有化部署编排
# 用法：cp .env.example .env 并填写密钥后执行
#   docker compose -f docker-compose.agentar.yaml up -d --build
#
# 说明：
# - 应用关系库默认使用 MySQL 8（APP_DB_BACKEND=mysql），表名带 agentar_mem_app_ 前缀；
#   如需 PostgreSQL，将 APP_DB_BACKEND 改为 postgres 并调整连接变量。
# - 向量库使用 pgvector（PostgreSQL + vector 扩展）。
# - 服务端/前端镜像基于阿里龙蜥 Anolis OS 8（x86_64），在 Apple Silicon 等
#   ARM 机器上构建请加：--build-arg 或 COMPOSE_DOCKER_CLI_BUILD=1 DOCKER_DEFAULT_PLATFORM=linux/amd64
# - 日志写入项目同级目录 ./logs（挂载到容器 /logs），按天滚动，默认保留 14 天。
# - FASTAPI worker 数通过 MEM0_WORKERS 控制（默认 1）。

name: agentar-mem

services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile.agentar
    image: agentar-mem-server:latest
    restart: unless-stopped
    ports:
      - "8888:8000"
    env_file:
      - .env
    environment:
      - MEM0_TELEMETRY=false
      # 应用关系库：MySQL 8
      - APP_DB_BACKEND=${APP_DB_BACKEND:-mysql}
      - APP_DB_HOST=${APP_DB_HOST:-mysql}
      - APP_DB_PORT=${APP_DB_PORT:-3306}
      - APP_DB_USER=${APP_DB_USER:-agentar}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?请在 .env 中设置 APP_DB_PASSWORD}
      - APP_DB_NAME=${APP_DB_NAME:-agentar_mem_app}
      - APP_TABLE_PREFIX=${APP_TABLE_PREFIX:-agentar_mem_app_}
      # 向量库（pgvector）
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      - POSTGRES_COLLECTION_NAME=${POSTGRES_COLLECTION_NAME:-agentar_mem0}
      # 日志与 worker 数
      - LOG_DIR=/logs
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT:-14}
      - MEM0_WORKERS=${MEM0_WORKERS:-1}
    volumes:
      - ../logs:/logs
      - ./history:/app/server/history
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/docs >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${APP_DB_NAME:-agentar_mem_app}
      - MYSQL_USER=${APP_DB_USER:-agentar}
      - MYSQL_PASSWORD=${APP_DB_PASSWORD:?请在 .env 中设置 APP_DB_PASSWORD}
    volumes:
      - mysql_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    shm_size: "128mb"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.agentar
    image: agentar-mem-dashboard:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8888}
      - API_INTERNAL_URL=http://server:8000
      - NEXT_PUBLIC_INSTANCE_NAME=${NEXT_PUBLIC_INSTANCE_NAME:-Agentar 记忆平台}
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || curl -fsS http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_db:
  postgres_db:
